<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Información de la Barrica</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; }
        .data-box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; max-width: 400px; background: #f9f9f9; }
        .label { font-weight: bold; }
    </style>
</head>
<body>
    <div id="info" class="data-box">
        <p>Cargando información...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        // Capturamos los datos directamente desde la URL del QR
        const barrica = urlParams.get('barrica');
        const lote = urlParams.get('lote');
        const folio = urlParams.get('folio');
        const uso = urlParams.get('uso');
        const entrada = urlParams.get('entrada');
        const salida = urlParams.get('salida');

        const infoDiv = document.getElementById('info');

        if (barrica) {
            infoDiv.innerHTML = `
                <h3>Detalles de la Barrica</h3>
                <p><span class="label">Barrica:</span> ${barrica}</p>
                <p><span class="label">Lote:</span> ${lote}</p>
                <p><span class="label">Folio:</span> ${folio}</p>
                <p><span class="label">Uso:</span> ${uso}</p>
                <p><span class="label">Entrada:</span> ${entrada}</p>
                <p><span class="label">Salida estimada:</span> ${salida}</p>
            `;
        } else {
            infoDiv.innerHTML = "<p>No se encontraron datos de la barrica.</p>";
        }
    </script>
</body>
</html>
